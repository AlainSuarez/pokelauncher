{% extends 'base.html' %}
{% block content %}
      <div id="library-view">
      {% include 'includes/navbar.html' %}

      <section class="toolbar" aria-label="Filtros">
        <div class="chips" id="filter-chips">
          <button class="chip active" data-filter="all">Todos</button>
          <button class="chip" data-filter="owned">En mi colección</button>
          <button class="chip" data-filter="favorites">♥ Favoritos</button>
          <button class="chip" data-filter="missing">Por conseguir</button>
        </div>
        <div class="toolbar-right">
          <span id="result-count" class="result-count"></span>
          <select id="sort" class="sort" aria-label="Ordenar">
            <option value="release">Lanzamiento</option>
            <option value="name">Nombre A–Z</option>
            <option value="generation">Generación</option>
          </select>
        </div>
      </section>

      <section id="game-grid" class="game-grid" aria-live="polite"></section>

      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-ball"></div>
        <h3>No hay resultados</h3>
        <p>Prueba con otro nombre o cambia el filtro.</p>
        <button class="btn btn-ghost" id="clear-filters">Limpiar filtros</button>
      </div>

      </div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/library.js') }}"></script>{% endblock %}
